# the linter will check if the syntax, format, indentation is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"
    
jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4 

      - name: Install Linter
        run: pip install ruff

      - name: Check the file for linting
        run: ruff check .

      

  
